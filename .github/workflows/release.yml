name: Release

# Push an annotated tag like v0.2.0 (must match apps/desktop/pubspec.yaml and
# appVersion in app.dart; its message becomes "What's new") to build the
# Linux and Windows packages and publish a GitHub release. The website's
# download buttons point at releases/latest, so they go live as soon as this
# finishes.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.1.0"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  linux:
    name: Linux x86_64
    runs-on: ubuntu-22.04 # older glibc → runs on more distros
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Check tag matches app version
        run: |
          V=$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' apps/desktop/pubspec.yaml)
          echo "pubspec version: $V, tag: $TAG"
          [ "v$V" = "$TAG" ] || { echo "::error::Tag $TAG does not match pubspec version $V"; exit 1; }
          A=$(sed -n "s/^const appVersion = '\(.*\)';/\1/p" apps/desktop/lib/src/app.dart)
          [ "$A" = "$V" ] || { echo "::error::appVersion in app.dart ($A) does not match pubspec ($V)"; exit 1; }

      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev file desktop-file-utils

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.x
          cache: true

      - name: Test before shipping
        run: |
          flutter pub get
          (cd packages/core && dart test)
          (cd packages/persistence && dart test)
          (cd packages/canvas && flutter test)
          (cd apps/desktop && flutter test)

      - name: Validate desktop entry
        run: desktop-file-validate apps/desktop/linux/packaging/dev.fcastro.LocalBoard.desktop

      - name: Build & package
        run: ./scripts/package-linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/LocalBoard-*
          if-no-files-found: error

  windows:
    name: Windows x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Check tag matches app version
        shell: pwsh
        run: |
          $V = (Select-String -Path apps/desktop/pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          Write-Host "pubspec version: $V, tag: $env:TAG"
          if ("v$V" -ne $env:TAG) { Write-Error "Tag $env:TAG does not match pubspec version $V"; exit 1 }

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.x
          cache: true

      - name: Test on Windows
        run: |
          flutter pub get
          cd apps/desktop
          flutter test

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build & package
        shell: pwsh
        run: ./scripts/package-windows.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/LocalBoard-*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum LocalBoard-* > SHA256SUMS && cat SHA256SUMS

      - name: Release notes
        run: |
          VERSION=${TAG#v}
          # The app shows the first lines of these notes in its update screen,
          # so "What's new" goes first: it is the annotated tag's message.
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          git for-each-ref "refs/tags/$TAG" --format='%(contents)' | sed '/-----BEGIN PGP/,$d' > notes.md
          echo >> notes.md
          cat >> notes.md <<EOF
          ## Download: Windows and Linux

          ### Windows (10 and 11, 64-bit)
          - \`LocalBoard-${VERSION}-Setup-x64.exe\`: installer. Installs for your user, no administrator needed. Adds a Start menu entry and opens \`.whiteboard\` files.
          - \`LocalBoard-${VERSION}-windows-x64.zip\`: portable: unzip and run \`LocalBoard.exe\`.

          The installer isn't code-signed yet, so Windows SmartScreen may show "Windows protected your PC". Click **More info → Run anyway**.

          ### Linux (64-bit)
          **Install (recommended)**
          \`\`\`sh
          curl -fsSL https://localboards.vercel.app/install.sh | sh
          \`\`\`

          **Or download**
          - \`LocalBoard-${VERSION}-x86_64.AppImage\`: run directly: \`chmod +x LocalBoard-*.AppImage && ./LocalBoard-*.AppImage\`
          - \`LocalBoard-${VERSION}-linux-x86_64.tar.gz\`: portable bundle

          Already installed? Local Board tells you when a new version is out and updates itself in one click.

          Checksums for every file are in \`SHA256SUMS\`. macOS is not available yet.
          EOF

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION=${TAG#v}
          FILES=(dist/LocalBoard-* dist/SHA256SUMS)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            gh release create "$TAG" "${FILES[@]}" --title "Local Board ${VERSION}" --notes-file notes.md --latest
          fi
