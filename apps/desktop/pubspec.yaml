name: local_board
description: "Local Board — a local-first whiteboard. Your boards live on your computer."
publish_to: none
version: 0.3.0+3

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  local_board_core: any
  local_board_persistence: any
  local_board_canvas: any
  file_selector: ^1.1.0
  crypto: ^3.0.0
  path: ^1.9.0
  pasteboard: ^0.5.0
  desktop_drop: ^0.8.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.svg.png
