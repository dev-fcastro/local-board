<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6259f5"/>
      <stop offset="1" stop-color="#3a32c2"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1b1670" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Tile -->
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#sheen)"/>

  <!-- Stored layers: the board lives on your disk -->
  <path d="M232 604 L512 744 L792 604" fill="none" stroke="#ffffff" stroke-opacity="0.38"
        stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M232 516 L512 656 L792 516" fill="none" stroke="#ffffff" stroke-opacity="0.68"
        stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- The board -->
  <path d="M512 288 L792 428 L512 568 L232 428 Z" fill="#ffffff" stroke="#ffffff"
        stroke-width="44" stroke-linejoin="round" filter="url(#lift)"/>

  <!-- A stroke being drawn on it -->
  <path d="M372 428 L480 374 L604 446" fill="none" stroke="#4f46e5"
        stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="604" cy="446" r="24" fill="#4f46e5"/>
</svg>
