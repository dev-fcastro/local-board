<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 64" fill="none">
  <!-- ISOTIPO: Lienzo isométrico en capas + vector en creación -->
  <g id="icon" transform="translate(6, 6)">
    <!-- Base estructural / Persistencia en disco (capa inferior) -->
    <path 
      d="M6 34 L26 44 L46 34" 
      stroke="currentColor" 
      stroke-width="3" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />
    
    <!-- Lienzo flotante (Canvas superior de dibujo) -->
    <path 
      d="M26 6 L46 16 L26 26 L6 16 Z" 
      stroke="currentColor" 
      stroke-width="3.5" 
      stroke-linejoin="round"
    />
    <path 
      d="M6 16 V24 L26 34 L46 24 V16" 
      stroke="currentColor" 
      stroke-width="3.5" 
      stroke-linejoin="round"
    />

    <!-- Elemento trazado sobre la pizarra: Vértice activo + Nodo -->
    <path 
      d="M16 16 L24 12 L33 18" 
      stroke="currentColor" 
      stroke-width="3" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />
    <circle cx="33" cy="18" r="2.5" fill="currentColor"/>
  </g>

  <!-- LOGOTIPO: Presencia sólida, kerning compacto, todo integrado -->
  <text 
    x="68" 
    y="41" 
    fill="currentColor" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    letter-spacing="-0.5"
  >
    <tspan font-size="28" font-weight="900">LOCAL</tspan>
    <tspan font-size="28" font-weight="400" letter-spacing="1">BOARD</tspan>
  </text>
</svg>
